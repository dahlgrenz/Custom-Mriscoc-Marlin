name: music_quiz
description: Ett mobilt musikquiz i Hitster-stil (Flutter + Firebase + Spotify).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Tillstånd
  provider: ^6.1.2

  # Firebase (realtidsflerspelare)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4

  # Spotify: uppspelning på enhet
  spotify_sdk: ^3.0.2

  # Nätverk (Spotify Web API för metadata) + hjälp
  http: ^1.2.2
  flutter_dotenv: ^5.1.0
  uuid: ^4.5.1

  # QR-kod + delning (låt andra gå med via webben)
  qr_flutter: ^4.1.0
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    # Webbklienten (statiska filer) som värdtelefonen serverar över LAN.
    # Se web_client/README.md.
    - web_client/
